spring.application.name=payment-service

#======================================
# Kafka configs common
#======================================
payment-service.kafka-topic=payment-created
spring.kafka.bootstrap-servers=localhost:9092

#======================================
# Kafka producer
#======================================
spring.kafka.producer.client-id=payment-service-producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# old approach when kafka published PaymentCreatedEvent =======================
#spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
#==============================================================================
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[delivery.timeout.ms]=60000

# Outbox event publisher - ISO-8601 format of time duration
payment-service.outbox.publisher.batch-size=5
payment-service.outbox.publisher.scheduler-interval=PT2M
# Retry policy
payment-service.outbox.publisher.retry.max-attempt=7
payment-service.outbox.publisher.retry.multiplier=2
payment-service.outbox.publisher.retry.initial-backoff=PT2M
payment-service.outbox.publisher.retry.max-backoff=PT1H


#======================================
# Kafka consumer
#======================================
spring.kafka.consumer.client-id=payment-service-consumer
spring.kafka.consumer.group-id=payment-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# old approach when kafka consumed PaymentCreatedEvent =============================
#spring.kafka.consumer.properties[spring.deserializer.key.delegate.class]=org.apache.kafka.common.serialization.StringDeserializer
#spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
#===================================================================================
spring.kafka.consumer.properties[spring.json.value.default.type]=priv.home.paymentservice.eventpublisher.model.PaymentCreatedEvent
spring.kafka.consumer.properties[spring.json.trusted.packages]=priv.home.paymentservice.eventpublisher.model
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

# Publisher scheduler
payment-service.payment-event-publisher.scheduler.publish=0 0/2 * * * *