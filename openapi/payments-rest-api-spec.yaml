openapi: 3.1.0
info:
  title: Payment Service REST API
  version: 0.0.1
servers:
- url: http://localhost:8080
  description: Local deployment server url
paths:
  /payments:
    post:
      summary: Payment creation JSON input
      tags:
      - payment-creation
      operationId: createPaymentFromJson
      parameters:
      - name: idempotency-key
        in: header
        required: true
        description: key for idempotent payment creation
        schema:
          type: string
      requestBody:
        description: Payment initiation message using JSON format input.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
            examples:
              PaymentCreationJsonInputExample:
                $ref: '#/components/examples/paymentCreationJsonInputExample'
        required: true
      responses:
        "200":
          description: OK. Payment instruction for given idempotency-key was already created.
          headers:
            Location:
              description: URI of the payment resource
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              examples:
                ValidPaymentResponse:
                  $ref: '#/components/examples/paymentResponseExample'
        "201":
          description: CREATED. Payment instruction created. Payment instruction successfully validated and accepted for processing. 
                       (It does not mean that the payment has been executed, settled, or credited to the beneficiary)
          headers:
            Location:
              description: URI of the newly created payment resource
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              examples:
                ValidPaymentResponse:
                  $ref: '#/components/examples/paymentResponseExample'
        "400":
          description: BAD REQUEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ErrorResponseBadRequestJsonExample:
                  $ref: '#/components/examples/ErrorResponseBadRequestJsonExample'
        "404":
          description: NOT FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NoStaticResourceNotFoundExample:
                  $ref: '#/components/examples/NoStaticResourceNotFoundExample'
        "405":
          description: METHOD NOT ALLOWED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ErrorResponseMethodGetNotAllowedExample:
                  $ref: '#/components/examples/ErrorResponseMethodGetNotAllowedExample'
        "406":
          description: NOT ACCEPTABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ErrorResponse406AcceptableIsJsonExample:
                  $ref: '#/components/examples/ErrorResponse406AcceptableIsJsonExample'
        "415":
          description: UNSUPPORTED MEDIA TYPE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ErrorResponseNotSupportedXmlExample:
                  $ref: '#/components/examples/ErrorResponseNotSupportedXmlExample'
        "500":
          description: 500 INTERNAL_SERVER_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ErrorResponseInternalServerError:
                  $ref: '#/components/examples/ErrorResponseInternalServerError'
  /payments/pain001:
    post:
      summary: Payment creation XML input
      tags:
      - payment-creation
      operationId: createPaymentFromPain001
      parameters:
      - name: idempotency-key
        in: header
        required: true
        description: key for idempotent payment creation
        schema:
          type: string
      requestBody:
        description: Payment initiation message using the Payment Service limited profile based on ISO 20022 pain.001.001.12. Only the elements and fields defined by this profile are supported.
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/Pain001Document'
            examples:
              ValidLimitedPain001RequestBody:
                $ref: '#/components/examples/LimitedPain001RequestBody'
        required: true
      responses:
        "200":
          description: OK. Payment instruction for given idempotency-key was already created.
          headers:
            Location:
              description: URI of the payment resource
              schema:
                type: string
                format: uri
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Pain002Document'
              examples:
                LimitedPain002ResponseBody:
                  $ref: '#/components/examples/LimitedPain002ResponseBody'
        "201":
          description: CREATED. Payment instruction created. Payment instruction successfully validated and accepted for processing.
                       (It does not mean that the payment has been executed, settled, or credited to the beneficiary)
          headers:
            Location:
              description: URI of the newly created payment resource
              schema:
                type: string
                format: uri
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Pain002Document'
              examples:
                LimitedPain002ResponseBody:
                  $ref: '#/components/examples/LimitedPain002ResponseBody'
        "400":
          description: BAD REQUEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ErrorResponseBadRequestXmlExample:
                  $ref: '#/components/examples/ErrorResponseBadRequestXmlExample'
        "404":
          description: NOT FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NoStaticResourceNotFoundExample:
                  $ref: '#/components/examples/NoStaticResourceNotFoundExample'
        "405":
          description: METHOD NOT ALLOWED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ErrorResponseMethodGetNotAllowedExample:
                  $ref: '#/components/examples/ErrorResponseMethodGetNotAllowedExample'
        "406":
          description: NOT ACCEPTABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ErrorResponse406AcceptableIsXmlExample:
                  $ref: '#/components/examples/ErrorResponse406AcceptableIsXmlExample'
        "415":
          description: UNSUPPORTED MEDIA TYPE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ErrorResponseNotSupportedJsonExample:
                  $ref: '#/components/examples/ErrorResponseNotSupportedJsonExample'
        "500":
          description: 500 INTERNAL SERVER ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ErrorResponseInternalServerError:
                  $ref: '#/components/examples/ErrorResponseInternalServerError'
  /payments/{id}:
    get:
      summary: Payment retrieval
      tags:
      - payment-retrieval
      operationId: retrievePayment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              examples:
                PaymentRetrievedExample:
                  $ref: '#/components/examples/paymentResponseExample'
        "400":
          description: BAD REQUEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ErrorResponseBadRequestInvalidUuidExample:
                  $ref: '#/components/examples/ErrorResponseBadRequestInvalidUuidExample'
        "404":
          description: NOT FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                PaymentRetrievalNotFoundExample:
                  $ref: '#/components/examples/PaymentRetrievalNotFoundExample'
        "405":
          description: METHOD NOT ALLOWED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ErrorResponseMethodNotAllowedExample:
                  $ref: '#/components/examples/ErrorResponseMethodPostNotAllowedExample'
        "406":
          description: NOT ACCEPTABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ErrorResponse406AcceptableIsJsonExample:
                  $ref: '#/components/examples/ErrorResponse406AcceptableIsJsonExample'
        "500":
          description: 500 INTERNAL SERVER ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ErrorResponseInternalServerError:
                  $ref: '#/components/examples/ErrorResponseInternalServerError'
components:
  examples:
    LimitedPain001RequestBody:
      summary: limited-pain001 payment initiation request example
      description: Example of a single credit transfer instruction.
      value: |
        <?xml version="1.0" encoding="UTF-8"?>
        <Document xmlns="urn:iso:std:iso:20022:tech:xsd:pain.001.001.12">
            <CstmrCdtTrfInitn>
                <GrpHdr>
                    <MsgId>MSG-20261031-001</MsgId>
                    <CreDtTm>2026-10-31T16:51:01Z</CreDtTm>
                    <NbOfTxs>1</NbOfTxs>
                    <CtrlSum>1250.50</CtrlSum>
                    <InitgPty>
                        <Nm>Example Company</Nm>
                    </InitgPty>
                </GrpHdr>
                <PmtInf>
                    <PmtInfId>PMT-20261031-001</PmtInfId>
                    <PmtMtd>TRF</PmtMtd>
                    <NbOfTxs>1</NbOfTxs>
                    <CtrlSum>1250.50</CtrlSum>
                    <PmtTpInf>
                        <InstrPrty>NORM</InstrPrty>
                        <SvcLvl>
                            <Cd>SEPA</Cd>
                        </SvcLvl>
                    </PmtTpInf>
                    <ReqdExctnDt>
                        <Dt>2026-11-02</Dt>
                    </ReqdExctnDt>
                    <Dbtr>
                        <Nm>Example Debtor Ltd</Nm>
                    </Dbtr>
                    <DbtrAcct>
                        <Id>
                            <IBAN>DE89370400440532013000</IBAN>
                        </Id>
                    </DbtrAcct>
                    <DbtrAgt>
                        <FinInstnId>
                            <BICFI>DEUTDEFF</BICFI>
                        </FinInstnId>
                    </DbtrAgt>
                    <ChrgBr>SLEV</ChrgBr>
                    <CdtTrfTxInf>
                        <PmtId>
                            <EndToEndId>E2E-20261031-001</EndToEndId>
                        </PmtId>
                        <Amt>
                            <InstdAmt Ccy="EUR">1250.50</InstdAmt>
                        </Amt>
                        <CdtrAgt>
                            <FinInstnId>
                                <BICFI>BNPAFRPP</BICFI>
                            </FinInstnId>
                        </CdtrAgt>
                        <Cdtr>
                            <Nm>Example Creditor SAS</Nm>
                        </Cdtr>
                        <CdtrAcct>
                            <Id>
                                <IBAN>FR1420041010050500013M02606</IBAN>
                            </Id>
                        </CdtrAcct>
                    </CdtTrfTxInf>
                </PmtInf>
            </CstmrCdtTrfInitn>
        </Document>
    LimitedPain002ResponseBody:
      summary: Limited-pain002 response example
      description: Technical acceptance confirmation for a single payment instruction. 
                   (ACTC does not indicate payment execution or settlement)
      value: |
        <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
        <Document xmlns="urn:iso:std:iso:20022:tech:xsd:pain.002.001.14">
            <CstmrPmtStsRpt>
                <GrpHdr>
                    <MsgId>S-44387ce1b18c4a1e882fe0e5446f9d34</MsgId>
                    <CreDtTm>2026-10-31T18:06:37.1878498+01:00</CreDtTm>
                </GrpHdr>
                <OrgnlGrpInfAndSts>
                    <OrgnlMsgId>MSG-20261031-001</OrgnlMsgId>
                    <OrgnlMsgNmId>pain.001.001.12</OrgnlMsgNmId>
                </OrgnlGrpInfAndSts>
                <OrgnlPmtInfAndSts>
                    <OrgnlPmtInfId>PMT-20261031-001</OrgnlPmtInfId>
                    <TxInfAndSts>
                        <OrgnlEndToEndId>E2E-20261031-001</OrgnlEndToEndId>
                        <TxSts>ACTC</TxSts>
                    </TxInfAndSts>
                </OrgnlPmtInfAndSts>
            </CstmrPmtStsRpt>
        </Document>
    paymentResponseExample:
      summary: payment response json
      description: Example of a correct payment response.
      value:
        amount: 123.45
        currency: PLN
        paymentId: dc22d83f-8d08-4156-9937-f5f15897ff34
        paymentStatus: CREATED
    ErrorResponseBadRequestJsonExample:
      summary: error response bad request
      description: Field 'currency' must not be blank
      value:
        httpStatus: 400 BAD_REQUEST
        message: Field 'currency' must not be blank
    ErrorResponseBadRequestXmlExample:
      summary: error response bad request
      description: Pain.001 XML is malformed or does not match the supported profile
      value:
        httpStatus: 400 BAD_REQUEST
        message: Pain.001 XML is malformed or does not match the supported profile
    ErrorResponseInternalServerError:
      summary: error response server exception
      description: Unexpected error occurred
      value:
        httpStatus: 500 INTERNAL_SERVER_ERROR
        message: Unexpected error occurred
    PaymentRetrievalNotFoundExample:
      summary: payment not found
      description: not found payment for given id
      value:
        httpStatus: 404 NOT_FOUND
        message: Not found payment with given id = 1aca62b8-9a7f-4110-98ec-33cd67a9325d
    ErrorResponseNotSupportedXmlExample:
      summary: error response unsupported media type
      description: Content-Type 'application/xml' is not supported
      value:
        httpStatus: 415 UNSUPPORTED_MEDIA_TYPE
        message: Content-Type 'application/xml' is not supported
    ErrorResponseNotSupportedJsonExample:
      summary: error response unsupported media type
      description: Content-Type 'application/json' is not supported
      value:
        httpStatus: 415 UNSUPPORTED_MEDIA_TYPE
        message: Content-Type 'application/json' is not supported
    ErrorResponseMethodGetNotAllowedExample:
      summary: error response method not allowed
      description: Request method 'GET' is not supported
      value:
        httpStatus: 405 METHOD_NOT_ALLOWED
        message: Request method 'GET' is not supported
    ErrorResponseMethodPostNotAllowedExample:
      summary: error response method not allowed
      description: Request method 'POST' is not supported
      value:
        httpStatus: 405 METHOD_NOT_ALLOWED
        message: Request method 'POST' is not supported
    ErrorResponseBadRequestInvalidUuidExample:
      summary: bad request invalid uuid value
      description: 'Invalid UUID string: 1aca62b8-9a7f-4110-33cd67a9325d'
      value:
        httpStatus: 400 BAD_REQUEST
        message: 'Invalid UUID string: 1aca62b8-9a7f-4110-33cd67a9325d'
    NoStaticResourceNotFoundExample:
      summary: error response not found static resource
      description: Not found 404 - no static resource
      value:
        httpStatus: 404 NOT_FOUND
        message: No static resource create-payment/pain001 for request '/create-payment/pain001'
    ErrorResponse406AcceptableIsJsonExample:
      summary: error response not supported expected response type
      description: 'Acceptable representations: [application/json].'
      value:
        httpStatus: 406 NOT_ACCEPTABLE
        message: 'Acceptable representations: [application/json].'
    ErrorResponse406AcceptableIsXmlExample:
      summary: error response not supported expected response type
      description: 'Acceptable representations: [application/xml].'
      value:
        httpStatus: 406 NOT_ACCEPTABLE
        message: 'Acceptable representations: [application/xml].'
    paymentCreationJsonInputExample:
      summary: JSON input example
      description: Example of JSON input payment creation
      value:
        amount: 123.45
        currency: PLN
  schemas:
    ErrorResponse:
      required:
        - httpStatus
        - message
      type: object
      properties:
        httpStatus:
          type: string
        message:
          type: string
    CreatePaymentRequest:
      type: object
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
        currency:
          type: string
          minLength: 1
          maxLength: 3
      required:
      - amount
      - currency
    Pain001Document:
      type: object
      properties:
        cstmrCdtTrfInitn:
          $ref: '#/components/schemas/CustomerCreditTransferInitiationV12'
          xml:
            name: CstmrCdtTrfInitn
            namespace: urn:iso:std:iso:20022:tech:xsd:pain.001.001.12
      required:
        - cstmrCdtTrfInitn
      xml:
        name: Document
        namespace: urn:iso:std:iso:20022:tech:xsd:pain.001.001.12
      additionalProperties: false
      description: Root element of the limited-pain001 input profile.
    CustomerCreditTransferInitiationV12:
      type: object
      xml:
        namespace: urn:iso:std:iso:20022:tech:xsd:pain.001.001.12
      properties:
        grpHdr:
          $ref: '#/components/schemas/GroupHeader114'
          xml:
            name: GrpHdr
        pmtInf:
          type: array
          items:
            $ref: '#/components/schemas/PaymentInstruction44'
          xml:
            name: PmtInf
          minItems: 1
      required:
        - grpHdr
        - pmtInf
      additionalProperties: false
    GroupHeader114:
        type: object
        xml:
          namespace: urn:iso:std:iso:20022:tech:xsd:pain.001.001.12
        properties:
          msgId:
            $ref: '#/components/schemas/Max35Text'
            xml:
              name: MsgId
          creDtTm:
            $ref: '#/components/schemas/ISODateTime'
            xml:
              name: CreDtTm
          nbOfTxs:
            $ref: '#/components/schemas/Max15NumericText'
            xml:
              name: NbOfTxs
          ctrlSum:
            $ref: '#/components/schemas/DecimalNumber'
            xml:
              name: CtrlSum
          initgPty:
            $ref: '#/components/schemas/PartyIdentification272'
            xml:
              name: InitgPty
        required:
          - msgId
          - creDtTm
          - nbOfTxs
          - ctrlSum
          - initgPty
        additionalProperties: false
    PaymentInstruction44:
      type: object
      xml:
        namespace: urn:iso:std:iso:20022:tech:xsd:pain.001.001.12
      properties:
        pmtInfId:
          $ref: '#/components/schemas/Max35Text'
          xml:
            name: PmtInfId
        pmtMtd:
          $ref: '#/components/schemas/PaymentMethod3Code'
          xml:
            name: PmtMtd
        nbOfTxs:
          $ref: '#/components/schemas/Max15NumericText'
          xml:
            name: NbOfTxs
        ctrlSum:
          $ref: '#/components/schemas/DecimalNumber'
          xml:
            name: CtrlSum
        pmtTpInf:
          $ref: '#/components/schemas/PaymentTypeInformation26'
          xml:
            name: PmtTpInf
        reqdExctnDt:
          $ref: '#/components/schemas/DateAndDateTime2Choice'
          xml:
            name: ReqdExctnDt
        dbtr:
          $ref: '#/components/schemas/PartyIdentification272'
          xml:
            name: Dbtr
        dbtrAcct:
          $ref: '#/components/schemas/CashAccount40'
          xml:
            name: DbtrAcct
        dbtrAgt:
          $ref: '#/components/schemas/BranchAndFinancialInstitutionIdentification8'
          xml:
            name: DbtrAgt
        chrgBr:
          $ref: '#/components/schemas/ChargeBearerType1Code'
          xml:
            name: ChrgBr
        cdtTrfTxInf:
          $ref: '#/components/schemas/CreditTransferTransaction61'
          xml:
            name: CdtTrfTxInf
      required:
        - pmtInfId
        - pmtMtd
        - nbOfTxs
        - ctrlSum
        - pmtTpInf
        - reqdExctnDt
        - dbtr
        - dbtrAcct
        - dbtrAgt
        - chrgBr
        - cdtTrfTxInf
      additionalProperties: false
    PaymentResponse:
      required:
        - paymentId
        - amount
        - currency
        - paymentStatus
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
        amount:
          type: number
        currency:
          type: string
        paymentStatus:
          type: string
          enum:
          - CREATED
    CustomerPaymentStatusReportV14:
      type: object
      properties:
        grpHdr:
          $ref: "#/components/schemas/GroupHeader128"
          xml:
            name: GrpHdr
        orgnlGrpInfAndSts:
          $ref: "#/components/schemas/OriginalGroupHeader22"
          xml:
            name: OrgnlGrpInfAndSts
        orgnlPmtInfAndSts:
          type: array
          items:
            $ref: "#/components/schemas/OriginalPaymentInstruction51"
          xml:
            name: OrgnlPmtInfAndSts
      required:
      - grpHdr
      - orgnlGrpInfAndSts
      - orgnlPmtInfAndSts
    Pain002Document:
      type: object
      properties:
        cstmrPmtStsRpt:
          $ref: "#/components/schemas/CustomerPaymentStatusReportV14"
          xml:
            name: CstmrPmtStsRpt
      required:
      - cstmrPmtStsRpt
    GroupHeader128:
      type: object
      properties:
        msgId:
          type: string
          xml:
            name: MsgId
        creDtTm:
          type: string
          format: date-time
          xml:
            name: CreDtTm
      required:
      - creDtTm
      - msgId
    OriginalGroupHeader22:
      type: object
      properties:
        orgnlMsgId:
          type: string
          xml:
            name: OrgnlMsgId
        orgnlMsgNmId:
          type: string
          xml:
            name: OrgnlMsgNmId
      required:
      - orgnlMsgId
      - orgnlMsgNmId
    OriginalPaymentInstruction51:
      type: object
      properties:
        orgnlPmtInfId:
          type: string
          xml:
            name: OrgnlPmtInfId
        txInfAndSts:
          type: array
          items:
            $ref: "#/components/schemas/PaymentTransaction160"
          xml:
            name: TxInfAndSts
      required:
      - orgnlPmtInfId
      - txInfAndSts
    PaymentTransaction160:
      type: object
      properties:
        orgnlEndToEndId:
          type: string
          xml:
            name: OrgnlEndToEndId
        txSts:
          type: string
          xml:
            name: TxSts
      required:
      - orgnlEndToEndId
      - txSts
    PaymentIdentification6:
      type: object
      xml:
        namespace: urn:iso:std:iso:20022:tech:xsd:pain.001.001.12
      properties:
        instrId:
          $ref: '#/components/schemas/Max35Text'
          xml:
            name: InstrId
        endToEndId:
          $ref: '#/components/schemas/Max35Text'
          xml:
            name: EndToEndId
        uetr:
          $ref: '#/components/schemas/UUIDv4Identifier'
          xml:
            name: UETR
      required:
        - endToEndId
      additionalProperties: false
    PartyIdentification272:
      type: object
      properties:
        nm:
          $ref: '#/components/schemas/Max140Text'
          xml:
            name: Nm
            namespace: urn:iso:std:iso:20022:tech:xsd:pain.001.001.12
      required:
        - nm
      additionalProperties: false
    BranchAndFinancialInstitutionIdentification8:
      type: object
      properties:
        finInstnId:
          $ref: '#/components/schemas/FinancialInstitutionIdentification23'
          xml:
            name: FinInstnId
            namespace: urn:iso:std:iso:20022:tech:xsd:pain.001.001.12
      required:
        - finInstnId
      additionalProperties: false
    FinancialInstitutionIdentification23:
      type: object
      properties:
        bicfi:
          $ref: '#/components/schemas/BICFIDec2014Identifier'
          xml:
            name: BICFI
            namespace: urn:iso:std:iso:20022:tech:xsd:pain.001.001.12
      required:
        - bicfi
      additionalProperties: false
    PaymentTypeInformation26:
      type: object
      xml:
        namespace: urn:iso:std:iso:20022:tech:xsd:pain.001.001.12
      properties:
        instrPrty:
          $ref: '#/components/schemas/Priority2Code'
          xml:
            name: InstrPrty
        svcLvl:
          type: array
          items:
            $ref: '#/components/schemas/ServiceLevel8Choice'
          xml:
            name: SvcLvl
        lclInstrm:
          $ref: '#/components/schemas/LocalInstrument2Choice'
          xml:
            name: LclInstrm
        ctgyPurp:
          $ref: '#/components/schemas/CategoryPurpose1Choice'
          xml:
            name: CtgyPurp
      additionalProperties: false
    CashAccount40:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/AccountIdentification4Choice'
          xml:
            name: Id
            namespace: urn:iso:std:iso:20022:tech:xsd:pain.001.001.12
      required:
        - id
      additionalProperties: false
    CreditTransferTransaction61:
      type: object
      xml:
        namespace: urn:iso:std:iso:20022:tech:xsd:pain.001.001.12
      properties:
        pmtId:
          $ref: '#/components/schemas/PaymentIdentification6'
          xml:
            name: PmtId
        amt:
          $ref: '#/components/schemas/AmountType4Choice'
          xml:
            name: Amt
        cdtrAgt:
          $ref: '#/components/schemas/BranchAndFinancialInstitutionIdentification8'
          xml:
            name: CdtrAgt
        cdtr:
          $ref: '#/components/schemas/PartyIdentification272'
          xml:
            name: Cdtr
        cdtrAcct:
          $ref: '#/components/schemas/CashAccount40'
          xml:
            name: CdtrAcct
      required:
        - pmtId
        - amt
        - cdtrAgt
